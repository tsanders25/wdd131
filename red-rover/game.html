<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="styles/red-rover-game-play.css">
    <script src="scripts/game-logic.js"></script>

</head>
<body>
    <header>
        <h1>Game Page</h1>
        <button id="menu" aria-label="Open Menu"></button>
            <nav>
                <ul class="navigation">
                    <li><a href="http://127.0.0.1:5501/wdd131/project/red-rover.html" title="home">Home</a></li>
                    <li><a href="http://127.0.0.1:5501/wdd131/project/study-buddy.html" title="study-buddy">Study Buddy</a></li>
                    <li><a href="http://127.0.0.1:5501/wdd131/project/game.html" title="game">Game</a></li>
                    <li><a href="http://127.0.0.1:5501/wdd131/project/about.html" title="about">About</a></li>
                </ul>
            </nav>
    </header>
    <main>
        <section id="team-creator">
            <h2>Create your teams!</h2>
            <div class="input-group">
                <label for="team-name">Team Name:</label>
                <input type="text" id="team-name" placeholder="e.g., Astronauts, Comets, Robots...">
                <button id="add-team-btn">Create Team!</button>
            </div>
        </section>
        <div id="team-display">
            <ul id="list"></ul>
        </div>
        
        <button id="begin-game-btn" class="main-btn">Begin Game!</button>
        <div id="questionOverlay" class = "hidden"> <!----Add class = "hidden"; here--->
            <div class="game-container">
                <!-- Question Counter (Point 7) -->
                <div id="questionCounter">Question 1 of 10</div>
        
                <!-- The Big Question Area (Point 10) -->
                <div id="versusContainer">
                    <div id="player1Display" class="competitor"></div>
                    <span>VS</span>
                    <div id="player2Display" class="competitor"></div>
                </div>

                <div id="questionBox">
                    <h1 id="questionText">The question will appear here...</h1>
                </div>
        
                <div id="answerArea" class="hidden">
                    <h2 id="answerText">The Answer</h2>
                    <p id="noteText"></p>
                </div>
        
                <!-- Controls -->
                <div class="controls">
                    <button id="reveal-btn" onclick="revealAnswer()">Show Answer</button>
                    <button id="next-btn" onclick="nextQuestion()">Next Question</button>
                    <button id="close-btn" onclick="closeGame()" class="exit-btn">Exit Chapter</button>
                </div>
            </div>
        </div>

    </main>
    <footer>
        <p>&copy;<span id="currentyear"></span> | Ty Sanders | United States</p>
        <p> Last Modified <span id="lastModified"></span></p>
    </footer>
</body>
</html>
